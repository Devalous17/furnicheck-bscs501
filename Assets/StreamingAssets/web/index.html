<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f5">
  <title>FurniCheck</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <main id="app" class="screen" aria-live="polite"></main>
    <nav class="bottom-nav" aria-label="Main navigation">
      <a class="nav-link" href="#/catalog" data-route="catalog">
        <span class="nav-icon" data-icon="grid"></span><span>Catalog</span>

      <a class="nav-link" href="#/saved" data-route="saved">
        <span class="nav-icon" data-icon="heart"></span><span>Saved</span>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>

</html>
